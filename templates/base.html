<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}MediBook{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
{% block css %}{% endblock %}
<style>
  .toast-stack { position: fixed; top: 18px; right: 18px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast { font-family: 'DM Sans', sans-serif; font-size: 0.88rem; padding: 12px 18px; border-radius: 10px;
           background: #0b1e3d; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.15); animation: toastIn .3s ease both; }
  .toast.success { background: #1a9e6c; }
  .toast.error { background: #e05454; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
{% if messages %}
<div class="toast-stack" id="toastStack">
  {% for message in messages %}<div class="toast {{ message.tags }}">{{ message }}</div>{% endfor %}
</div>
<script>setTimeout(() => { const t = document.getElementById('toastStack'); if (t) t.remove(); }, 4000);</script>
{% endif %}
{% block body %}{% endblock %}
</body>
</html>
