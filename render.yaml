# One-click Render deploy: Dashboard -> New -> Blueprint -> pick this repo.
# Database: a free PostgreSQL from https://neon.tech (never expires).
# Paste its connection string as DATABASE_URL when Render asks.

services:
  - type: web
    name: medibook
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn medibook.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # Admin account for /admin/ (Render asks you to type these during setup)
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_NAME
        value: Admin
      - key: DJANGO_SUPERUSER_PHONE
        value: "0000000000"
      # 1 = add demo doctors + patient (password demo1234), no demo admin
      - key: SEED_DEMO
        value: "1"
